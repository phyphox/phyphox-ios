# T1 test tier: the host-driven tests of the phyphox test strategy. They need a running app,
# so they build for the simulator, install, and drive the app through the remote-access API -
# which the -phyphoxRemote launch argument (AppDelegate, AutomationLaunchOptions) enables
# headlessly. The tools live in phyphox-docs, checked out as a sibling like the T0 corpus.
#
# Deliberately NOT scheduled: T1 runs on pushes to the development and release branches and on
# demand. It costs macOS runner minutes and needs no nightly cadence.
#
# What the simulator can and cannot do: it has no motion sensors, no barometer, no proximity
# and no ambient light, so about half the shipped collection cannot open there - the app
# reports the missing sensor and returns to the collection. The experiments driver classifies
# those as not loadable on this target rather than failed, and skips microphone experiments
# (AVAudioEngine's input can abort the app in a simulator), so the end-to-end job covers the
# loadable subset. Real coverage of the sensor experiments is a T2 lab-phone job, not this one.
name: t1
on:
  push:
    branches:
      - development
      - 'release/**'
  workflow_dispatch:

jobs:
  t1:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUNDLE: de.rwth-aachen.physics.phyphox
      # The port the app is told to serve remote access on (-phyphoxRemotePort); the tools use
      # the same one, the driver passes it to every launch itself.
      PORT: '8080'
    steps:
      - uses: actions/checkout@v5
        with:
          path: phyphox-ios
          submodules: recursive

      - uses: actions/checkout@v5
        with:
          repository: phyphox/phyphox-docs
          path: phyphox-docs

      - name: Test dependencies
        run: |
          set -euo pipefail
          pip3 install --break-system-packages pyyaml jsonschema
          # the broker the mqtt network fixture talks to
          brew install mosquitto

      - name: Build for the simulator
        run: >
          cd phyphox-ios/phyphox-iOS && xcodebuild build -project phyphox.xcodeproj
          -scheme phyphox -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$GITHUB_WORKSPACE/dd" CODE_SIGNING_ALLOWED=NO

      - name: Boot a simulator and install the app
        run: |
          set -euo pipefail
          # The newest iPhone simulator the runner image ships
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for r in sorted(d) for x in d[r] if x.get('isAvailable') and x['name'].startswith('iPhone')][-1])")
          test -n "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$GITHUB_WORKSPACE/dd/Build/Products/Debug-iphonesimulator/phyphox.app"
          # No permission dialog may block a headless run - and no launch argument can dismiss a
          # system one: a TCC prompt deactivates the app's scene, and phyphox tears its remote
          # server down when it resigns active, so the run is over with the app still alive.
          # "all" covers neither the camera nor motion & fitness (the camera is not even in
          # simctl's service list, though it is accepted), and those two are exactly what the
          # sweep needs: the camera experiments, and sensordb, whose sensors are declared
          # ignoreUnavailable and are therefore started even on a simulator that has none.
          # Granted by name, and loudly, so a future Xcode dropping a service name fails here
          # instead of hanging a test.
          xcrun simctl privacy "$UDID" grant all "$BUNDLE"
          for service in camera motion microphone location; do
            xcrun simctl privacy "$UDID" grant "$service" "$BUNDLE"
          done
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      # phyphox-test: remote-contract-t1
      - name: Remote interface contract test
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:$PORT"
          # The tone generator needs no sensor, no camera and no microphone - the least the
          # simulator can get wrong. Swap it for camera-luminance.phyphox if a runner ever
          # lacks an audio output device.
          xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" \
            -phyphoxUrl "phyphox://asset=tone_generator.phyphox" \
            -phyphoxRemote -phyphoxRemotePort "$PORT"
          for i in $(seq 30); do
            curl -fs -m 2 "$BASE/config" >/dev/null && break
            sleep 1
          done
          curl -fs -m 5 "$BASE/config" >/dev/null
          # Probes are uninformative on an experiment that has never measured
          curl -fs -m 5 "$BASE/control?cmd=start" >/dev/null
          sleep 3
          curl -fs -m 5 "$BASE/control?cmd=stop" >/dev/null
          python3 phyphox-docs/tools/contract_test.py --ios "$BASE" --allow-control
          xcrun simctl terminate "$UDID" "$BUNDLE" || true

      # phyphox-test: experiments-e2e-t1
      - name: Experiments end to end
        run: |
          set -euo pipefail
          # The driver opens, starts, stops and exports every experiment - it never presses a
          # button, which matters for sensordb.phyphox: its connection has no interval and only
          # fires on the Submit button, so nothing is posted to phyphox.org from here. Do not
          # point a trigger probe (contract_test --allow-control) at that experiment.
          xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
          # -u: unbuffered, so each experiment is timestamped in the step log as it happens
          # instead of the whole sweep arriving at once when the pipe is flushed
          python3 -u phyphox-docs/tools/t1_experiments.py --platform ios --serial "$UDID" \
            --port "$PORT" --collection "$GITHUB_WORKSPACE/phyphox-ios/phyphox-experiments" \
            --out t1-experiments.json

      # phyphox-test: graph-snapshots
      - name: Graph goldens
        run: |
          set -euo pipefail
          # The plot is drawn by OpenGL into a GLKView, which renders nothing in a layer-based
          # capture: the goldens need the view in a visible window on a real context, which is
          # what makes this row T1 while the other view goldens are T0.
          cd phyphox-ios/phyphox-iOS && xcodebuild test -project phyphox.xcodeproj \
            -scheme phyphox -destination "id=$UDID" \
            -only-testing phyphoxTests/GraphSnapshotTests CODE_SIGNING_ALLOWED=NO

      # phyphox-test: view-behavior
      # phyphox-test: app-chrome
      # phyphox-test: lifecycle
      # phyphox-test: accessibility-smoke
      # phyphox-test: switch-bypassed-ui
      - name: UI suites
        run: |
          set -euo pipefail
          # XCUITest drives the app itself: the fixtures' controls and what they write (through
          # the remote API), the chrome around an experiment, what an interruption does to a run,
          # the paths the -phyphox* switches bypass, and a report-only accessibility audit.
          xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
          cd phyphox-ios/phyphox-iOS && xcodebuild test -project phyphox.xcodeproj \
            -scheme phyphox -destination "id=$UDID" -only-testing phyphoxUITests \
            -skip-testing:phyphoxUITests/TranslationsUITests CODE_SIGNING_ALLOWED=NO

      # The chrome suite again on a tablet: the layouts differ, and an action sheet becomes a
      # popover there, which is a different dismissal path.
      - name: App chrome on a tablet
        run: |
          set -euo pipefail
          IPAD=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(([x['udid'] for r in sorted(d) for x in d[r] if x.get('isAvailable') and x['name'].startswith('iPad')] or [''])[-1])")
          if [ -z "$IPAD" ]; then echo "no iPad simulator on this runner - tablet layouts not covered"; exit 0; fi
          xcrun simctl boot "$IPAD"
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl privacy "$IPAD" grant all "$BUNDLE" || true
          cd phyphox-ios/phyphox-iOS && xcodebuild test -project phyphox.xcodeproj \
            -scheme phyphox -destination "id=$IPAD" \
            -only-testing phyphoxUITests/AppChromeTests CODE_SIGNING_ALLOWED=NO

      # phyphox-test: translations-ui
      - name: Every shipped language
        run: |
          set -euo pipefail
          # One launch per language of the canonical list: the experiment screen, its menu and
          # the collection, checked for text that lands outside the screen and for a menu that
          # lost entries. Screenshots per language are attached to the result bundle.
          xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
          cd phyphox-ios/phyphox-iOS && xcodebuild test -project phyphox.xcodeproj \
            -scheme phyphox -destination "id=$UDID" \
            -only-testing phyphoxUITests/TranslationsUITests CODE_SIGNING_ALLOWED=NO

      # phyphox-test: network-http
      # phyphox-test: network-mqtt
      - name: Network fixtures
        run: |
          set -euo pipefail
          # The runner starts phyphox-docs' fixture server and the broker itself, substitutes
          # the placeholders and serves the experiments over http, which is how they reach the
          # app.
          xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
          # The helpers' own logs go to the artifact: a fixture that cannot reach its server
          # produces empty buffers, which reads like an app failure until you can see whether
          # the server was even up.
          mkdir -p t1-diagnostics
          python3 -u phyphox-ios/.github/scripts/network_fixtures.py --udid "$UDID" \
            --fixtures phyphox-docs/fixtures/network --port "$PORT" \
            --log-dir t1-diagnostics --keep-going

      # A failing step here usually means the app stopped answering, and the reason is in the
      # crash reports and the device log - neither of which survives the runner. Collect both
      # so the next failure explains itself instead of needing another run.
      - name: Diagnostics
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p t1-diagnostics
          cp ~/Library/Logs/DiagnosticReports/phyphox-*.ips t1-diagnostics/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 20m --style compact \
            --predicate 'process == "phyphox"' > t1-diagnostics/phyphox-device.log 2>&1 || true
          # Who took the foreground: the app tears its remote server down when it resigns
          # active, so a run can end with the app alive and silent, and the reason is in
          # SpringBoard's log rather than the app's.
          xcrun simctl spawn "$UDID" log show --last 20m --style compact \
            --predicate 'process == "SpringBoard" OR process == "runningboardd"' 2>/dev/null \
            | tail -c 4000000 > t1-diagnostics/springboard.log || true
          ls -la t1-diagnostics

      - name: Collect the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-results
          path: |
            t1-*.json
            t1-diagnostics/
          if-no-files-found: ignore
